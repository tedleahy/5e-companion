    classes: [SaveCharacterSheetClassInput!]!
    weapons: [SaveCharacterSheetWeaponInput!]!
    inventory: [SaveCharacterSheetInventoryItemInput!]!
    features: [SaveCharacterSheetFeatureInput!]!
    spellbook: [SaveCharacterSheetSpellInput!]!
    """
    MULTICLASS proficiency choice provenance for classes newly added in this
    save. Includes SKILL and named (armor/weapon/tool/other) groups. Required
    when the save introduces new class rows that grant MULTICLASS choice groups;
    must be omitted or empty when no class is newly added so ordinary manual
    trait/skill edits stay unconstrained. Option values use `srdIndex ?? id`.
    Identity is `(classId, choiceGroup)`.
    """
    proficiencyChoices: [ProficiencyChoiceSelectionInput!]
}

# ---------------------------------------------------------------------------
# Queries & Mutations
# ---------------------------------------------------------------------------

type Query {
    compendiumCounts: CompendiumCounts!
    availableClasses: [AvailableClass!]!
    classDetails(value: String!): ClassDetails
    customClasses: [ClassDetails!]!
    attachedClassDetails(values: [String!]!): [ClassDetails!]!
    spells(filter: SpellFilter, pagination: SpellPagination): [Spell!]!
    spell(id: ID!): Spell
    character(id: ID!): Character
    hasCurrentUserCharacters: Boolean!
    currentUserCharacters: [Character!]!
    availableSubclasses(classIds: [String!]): [AvailableSubclass!]!
    customSubclasses(classIds: [String!]): [CustomSubclass!]!
    availableBackgrounds: [AvailableBackground!]!
    proficiencies(type: String): [ProficiencyRef!]!
}

type Mutation {
    # Character lifecycle
    createCharacter(input: CreateCharacterInput!): Character!
    updateCharacter(id: ID!, input: UpdateCharacterInput!): Character!
    deleteCharacter(id: ID!): Boolean!
    toggleInspiration(characterId: ID!): Character!

    # Custom subclass manager
    createCustomSubclass(input: ManagedCustomSubclassInput!): CustomSubclass!
    updateCustomSubclass(id: ID!, input: ManagedCustomSubclassInput!): CustomSubclass!
    archiveCustomSubclass(id: ID!): Boolean!
    createCustomClass(input: ManagedCustomClassInput!): ClassDetails!
    updateCustomClass(id: ID!, input: ManagedCustomClassInput!): ClassDetails!
    archiveCustomClass(id: ID!): Boolean!
    saveCharacterSheet(characterId: ID!, input: SaveCharacterSheetInput!): Character!

    # Live stats updates
    updateDeathSaves(characterId: ID!, input: DeathSavesInput!): CharacterStats!
    updateHitDice(characterId: ID!, input: [HitDicePoolInput!]!): CharacterStats!
    updateSkillProficiencies(characterId: ID!, input: SkillProficienciesInput!): CharacterStats!
    updateSavingThrowProficiencies(characterId: ID!, input: SavingThrowProficienciesInput!): CharacterStats!

    # Spellbook / spell slots
    learnSpell(characterId: ID!, spellId: ID!): CharacterSpell!
    forgetSpell(characterId: ID!, spellId: ID!): Boolean!
    prepareSpell(characterId: ID!, spellId: ID!): CharacterSpell!
    unprepareSpell(characterId: ID!, spellId: ID!): CharacterSpell!
    toggleSpellSlot(characterId: ID!, kind: SpellSlotKind!, level: Int!): SpellSlot!

    # Live gear updates
    updateInventoryItem(characterId: ID!, itemId: ID!, input: InventoryItemInput!): InventoryItem!

    # Rest / recovery
    spendHitDie(characterId: ID!, classId: String!, amount: Int! = 1): CharacterStats!
    shortRest(characterId: ID!): Character!
    longRest(characterId: ID!): Character!
}
