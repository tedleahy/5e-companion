name: 5e-companion

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: 5e_companion
      POSTGRES_PASSWORD: 5e_companion
      POSTGRES_DB: 5e_companion_development
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
