<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riso mixer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#2b2e33;color:#e7e9ec;font-family:"Manrope",system-ui,sans-serif}
.gal-top{padding:14px 22px 0;max-width:1600px;margin:0 auto}
.gal-top b{font-weight:600;font-size:13px;color:#fff}
.gal-intro{max-width:66ch;padding:10px 22px 18px;margin:0}
.gal-intro h1{font-size:26px;font-weight:700;margin:0 0 8px;letter-spacing:-.015em}
.gal-intro p{margin:0;color:#a9b0b9;font-size:14.5px;line-height:1.55}
.mixer{position:sticky;top:0;z-index:50;background:rgba(23,25,29,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid #3c4046;padding:10px 22px}
.mixer-inner{max-width:1600px;margin:0 auto}
.mixer-toggle{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:2px 0;
  border:0;background:none;color:#e7e9ec;font:600 13px/1.2 "Manrope",system-ui,sans-serif;
  cursor:pointer;text-align:left}
.mixer-toggle:hover,.mixer-toggle:focus-visible{color:#fff}
.mixer-toggle-action{flex:none}
.mixer-now{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:#8a919a;font-weight:500}
.mixer-now b{color:#d4d8de;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixer-now-inks{display:grid;grid-template-columns:repeat(4,11px);gap:2px;flex:none}
.mixer-now-inks i{display:block;height:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.mixer-chevron{flex:none;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg);margin-top:-3px}
.mixer.is-closed .mixer-chevron{transform:rotate(-45deg);margin-top:2px}
.mixer.is-closed .mixer-body{display:none}
.mixer:not(.is-closed) .mixer-toggle{margin-bottom:10px}
.mixer h2{margin:0 0 8px;font-size:12px;font-weight:600;color:#8a919a}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.preset{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid #3c4046;
  background:#1c1e22;color:#c3c9d1;font:600 12.5px/1.2 "Manrope",system-ui,sans-serif;cursor:pointer}
.preset:hover,.preset:focus-visible{border-color:#6f7681;color:#fff}
.preset[aria-current=true]{border-color:#fff;color:#fff;background:#26292e}
.preset-inks{display:grid;grid-template-columns:repeat(4,11px);gap:2px}
.preset-inks i{display:block;height:22px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.drums{display:flex;gap:10px;flex-wrap:wrap}
.drum{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border:1px solid #3c4046;background:#1c1e22}
.drum span{font-size:12px;color:#8a919a;white-space:nowrap}
.swatch{position:relative;width:28px;height:22px;flex:none;background:var(--sw,#333);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.swatch input[type=color]{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;
  opacity:0;cursor:pointer}
.drum input[type=text]{all:unset;width:7.2ch;font:500 12.5px/1 ui-monospace,"Cascadia Mono",monospace;color:#e7e9ec}
.note{margin:10px 0 0;color:#8a919a;font-size:12.5px;line-height:1.45;max-width:80ch}
.note b{color:#d4d8de;font-weight:600}
.hexline{margin:6px 0 0;color:#6f7681;font:12px/1.4 ui-monospace,"Cascadia Mono",monospace}
.studio{padding:28px 22px 48px}
.frames{max-width:1600px;margin:0 auto;display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
.framewrap{width:414px}
.frame-label{font-size:12.5px;font-weight:600;color:#e7e9ec;margin:0 0 4px 2px}
.frame-note{font-size:12px;color:#8a919a;line-height:1.5;margin:0 0 10px 2px}
.frame-note code{font-size:11.5px;color:#c3c9d1}
.frames-head{flex-basis:100%;padding-top:26px;border-top:1px solid #3c4046}
.frames-head:first-child{padding-top:0;border-top:0}
.frames-head h2{margin:0 0 4px;font-size:19px;font-weight:700;color:#fff;letter-spacing:-.01em}
.frames-head p{margin:0;color:#8a919a;font-size:13px;max-width:80ch;line-height:1.5}
.phone{flex:none;width:414px;padding:12px;border-radius:44px;background:#111318;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.75), inset 0 0 0 1px #43474e}
.phone-screen{width:390px;height:812px;border-radius:33px;overflow:hidden;position:relative}
.phone-scroll{width:100%;height:100%;overflow-y:auto;scrollbar-width:none}
.phone-scroll::-webkit-scrollbar{display:none}
/* A desktop frame shares a row with its phone frame only, scaled to fit. */
.frames-break{flex-basis:100%;height:0}
.deskwrap{flex:1 1 640px;min-width:0}
.stagebox{overflow:hidden}
.stage{transform-origin:top left;overflow:hidden;border-radius:8px;box-shadow:0 24px 60px -24px rgba(0,0,0,.7)}
@media (max-width:720px){
  .gal-intro{padding:8px 16px 12px}
  .gal-intro h1{font-size:22px}
  .mixer{padding:8px 16px}
  .studio{padding:18px 16px 36px}
  .framewrap,.phone{width:100%;max-width:414px}
}
:focus-visible{outline:2px solid #7cc4ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shared skeleton ---- */
.mat{height:100%;display:flex;flex-direction:column;position:relative}
.top{padding:20px 18px 14px}
.title{margin:0;font-size:21px;font-weight:700;letter-spacing:-.015em}
.find{display:flex;gap:8px;margin-top:13px}
.find label{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;min-width:0;min-height:44px}
.find input{all:unset;flex:1;font-size:14px;font-family:inherit;min-width:0}
.sortbtn{padding:0 13px;font-size:13px;cursor:pointer;font-family:inherit}
.rows{flex:1;padding:12px 12px 0;display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:13px;align-items:center;padding:11px 12px}
/* Name and subtitle wrap in a column beside the level block, the meter runs under both. */
.who{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:13px}
.who .idn{grid-area:1 / 1}
.who .lvl{grid-area:1 / 2;margin-bottom:8px}
.who .vitals-hp{grid-column:1 / -1}
.vitals-hp{flex:1;min-width:0}
.tok{width:56px;height:56px;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.name{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 8px;font-size:12.5px}
.meter{display:flex;gap:2px}
.meter i{flex:1;height:14px}
.hp{margin:5px 0 0;font-size:12px;font-weight:600}
.badgelab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1}
.tray{padding-bottom:16px;margin-bottom:2px}
.trayhead{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.draft .sub{margin-bottom:0}
.draft{display:grid;grid-template-columns:56px 1fr auto;gap:13px;align-items:center;padding:11px 12px}
.resume{padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.newwrap{position:sticky;bottom:0;padding:14px 12px 18px;margin-top:8px}
.newbtn{width:100%;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
/* The plate, the toolbar and the list share one measure, so nothing is aligned by arithmetic. */
.d{overflow:auto}
.wide-plate-inner,.toolbar-inner,.dbody{width:min(1020px,calc(100% - 48px));margin:0 auto}
.d .wide-plate{flex-shrink:0;padding:26px 0 24px}
.toolbar{position:sticky;top:0;z-index:5;padding:14px 0 18px}
.toolbar-inner{display:flex;align-items:center;gap:16px}
.dbody{padding:24px 0 44px;display:flex;flex-direction:column;gap:16px}
.d .title{font-size:30px}
.d .find{margin:0;flex:1;max-width:520px}
.dnew{width:auto;margin-left:auto;padding:12px 20px;font-size:14px}
.drow{display:grid;grid-template-columns:74px minmax(0,1fr) 84px 240px 128px;gap:22px;
  align-items:center;padding:16px 22px}
.d .tok{width:64px;height:64px;font-size:23px}
.d .name{font-size:19px}
.d .sub{font-size:13px;margin-bottom:0}
.go{padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.d .tray{margin-bottom:4px}
.d .draft{grid-template-columns:74px minmax(0,1fr) auto;gap:22px;padding:16px 22px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.lvl b{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.d .lvl .badgelab{font-size:13px}
/* Tablet uses the desktop plate and toolbar. Portrait is one column of the
   phone card. Landscape sets those cards in two columns. */
.tablet .row{grid-template-columns:64px minmax(0,1fr);column-gap:16px;padding:14px 18px}
.tablet:not(.land) .dbody{padding-bottom:28px}
.tablet .who .sub{margin:2px 0 8px}
.tablet .find{min-width:0}
/* Cards in a landscape row share a height. */
.land .dbody{display:grid;grid-template-columns:1fr 1fr}
.land .tray{grid-column:1 / -1;margin-bottom:0}
.draft + .draft{margin-top:12px}

/* ---- list states ---- */
/* First load: a spinner centred in the space the list will fill, the line under it. */
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:12px}
.d .dbody.fill{flex:1 0 auto}
.d .loading{gap:16px;padding-bottom:44px}
.spinner{width:36px;height:36px;fill:none;stroke-width:4;animation:spin .9s linear infinite}
.d .spinner{width:44px;height:44px}
@keyframes spin{to{transform:rotate(360deg)}}
.quiet{margin:0;font-size:13px;font-weight:500}
.d .quiet{font-size:14px}
.busy{flex:none;display:flex}
.busy .spinner{width:16px;height:16px;stroke-width:6}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.vitals-hp .hp:first-child{margin-top:0}
.tray.alone{padding-bottom:0}
.empty-card{padding:18px 18px 20px}
.notice{display:flex;gap:11px;align-items:flex-start;padding:16px 16px 18px 14px}
.notice > svg{width:18px;height:18px;flex:none;margin-top:2px}
.notice .badgelab{display:block;margin:3px 0 8px}
:is(.empty-card,.notice) h3{margin:0 0 5px;font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
:is(.empty-card,.notice) p{margin:0;font-size:13px;line-height:1.5}
.notice b{font-weight:700}
.retry{margin-top:14px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.d :is(.empty-card,.notice){padding:22px 24px 24px}
.d .notice{gap:13px;padding-left:20px}
.d .notice > svg{width:20px;height:20px;margin-top:3px}
.d :is(.empty-card,.notice) h3{font-size:19px}
.d :is(.empty-card,.notice) p{font-size:14px;max-width:64ch}

.riso{--full:var(--structural);--low:var(--accent);
  font-family:"Space Grotesk",system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(var(--dot) 1.1px,transparent 1.1px) 0 0/9px 9px,
    linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 27px,
    linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/27px 100%,
    var(--paper)}
.riso .top{background:var(--structural);color:var(--on-structural);padding-bottom:16px;box-shadow:5px 5px 0 var(--accent)}
.riso .title{font-weight:700;letter-spacing:-.03em}
.riso .find label{background:var(--card);color:var(--dim);border:2px solid var(--structural);box-shadow:4px 4px 0 var(--accent)}
.riso .find input{color:var(--text)}
.riso .find input::placeholder{color:var(--dim)}
.riso .sortbtn{background:var(--card);color:var(--structural);border:2px solid var(--structural);font-weight:700;
  box-shadow:4px 4px 0 var(--accent)}
.riso .row,.riso .drow,.riso .draft{background:var(--card);border:2px solid var(--structural);box-shadow:5px 5px 0 var(--accent)}
.riso .tok{border-radius:50%;font-weight:700;color:var(--on-structural);background:var(--structural);box-shadow:4px 4px 0 var(--accent)}
.riso .lvl b{color:var(--structural)}
.riso .name{font-weight:700;letter-spacing:-.02em}
.riso .sub{color:var(--dim)}
.riso .meter{gap:2px}
.riso .meter i{height:13px;background:var(--full)}
.riso .meter i[data-e]{background:var(--track)}
.riso .meter[data-hurt] i{background:var(--low)}
.riso .meter[data-hurt] i[data-e]{background:var(--track)}
.riso .hp{color:var(--dim);font-weight:500}
.riso .hp b{color:var(--structural);font-weight:700}
.riso :is(.row,.drow):has(.meter[data-hurt]) .hp b{color:var(--accent-text)}
.riso .badgelab{color:var(--dim)}
.riso .tray{border-bottom:2px dashed var(--accent)}
.riso .trayhead{color:var(--dim)}
.riso .draft{border-style:dashed;box-shadow:none;background:var(--draft-fill)}
.riso .draft .tok{background:var(--card);color:var(--structural);box-shadow:4px 4px 0 var(--rule),inset 0 0 0 2px var(--structural)}
.riso .resume{background:var(--card);color:var(--structural);border:2px solid var(--structural);box-shadow:3px 3px 0 var(--accent)}
.riso .newbtn{background:var(--accent);color:var(--on-accent);border:0;box-shadow:5px 5px 0 var(--structural)}
.riso .newwrap{background:linear-gradient(180deg,transparent,var(--paper) 45%);padding-bottom:24px}
.riso .d .wide-plate{background:var(--structural);color:var(--on-structural);box-shadow:0 5px 0 var(--accent);margin-bottom:5px}
.riso .toolbar{background:var(--paper);border-bottom:2px solid var(--structural)}
.riso .go{background:var(--card);border:2px solid var(--structural);color:var(--structural);box-shadow:3px 3px 0 var(--accent)}
.riso .quiet{color:var(--dim)}
.riso .lvl b[data-unset]{color:var(--dim)}
.riso .spinner circle{stroke:var(--track)}
.riso .spinner path{stroke:var(--structural)}
.riso .tray.alone{border-bottom:0}
/* A dashed empty card is a card not printed yet. An error is a warning strip, larger. */
.riso .empty-card{background:var(--card);border:2px dashed var(--structural)}
.riso .notice{background:var(--card);border-left:4px solid var(--accent-text)}
.riso .notice > svg{color:var(--accent-text)}
.riso :is(.empty-card,.notice) p{color:var(--dim)}
.riso .notice b{color:var(--text)}
.riso .notice.dev{border:2px dashed var(--structural);border-left:4px solid var(--accent-text)}
.riso .retry{background:var(--card);color:var(--structural);border:2px solid var(--structural);box-shadow:3px 3px 0 var(--accent)}

/* ---- interaction states ---- */
.riso :focus-visible{outline:2px solid var(--structural);outline-offset:3px}
.riso .top :focus-visible,.riso .wide-plate :focus-visible{outline-color:var(--on-structural)}
.riso .find label:focus-within{outline:2px solid var(--on-structural);outline-offset:3px}
.riso .toolbar .find label:focus-within{outline-color:var(--structural)}
.riso .find input:focus-visible{outline:none}
.riso .row:active,.riso .newbtn:active{transform:translate(5px,5px);box-shadow:none}
.riso :is(.go,.resume,.retry):active{transform:translate(3px,3px);box-shadow:none}
.riso .sortbtn:active{transform:translate(4px,4px);box-shadow:none}
.riso .go[aria-pressed=true]{background:var(--structural);color:var(--on-structural)}
.riso :is(.newbtn,.resume,.retry,.go,.sortbtn):is(:disabled,[aria-disabled=true]){background:transparent;color:var(--dim);
  box-shadow:inset 0 0 0 2px var(--rule);transform:none;cursor:not-allowed}
.riso .go:is(:disabled,[aria-disabled=true]){border-color:var(--rule);box-shadow:none}

/* ---- the card is one control: its name is a link stretched over it ---- */
.row{position:relative}
.rowlink{color:inherit;text-decoration:none}
.rowlink::after{content:"";position:absolute;inset:0}
.riso .rowlink:focus-visible{outline:none}
.riso .row:has(.rowlink:focus-visible){outline:2px solid var(--structural);outline-offset:3px}
a.go{display:inline-block;text-decoration:none;text-align:center}

/* ---- hit areas: every control answers taps across at least 44 by 44 ---- */
:is(.sortbtn,.resume,.retry,.go){position:relative}
:is(.sortbtn,.resume,.retry,.go)::after{content:"";position:absolute;
  top:min(0px,calc((100% - 44px) / 2));bottom:min(0px,calc((100% - 44px) / 2));
  left:min(0px,calc((100% - 44px) / 2));right:min(0px,calc((100% - 44px) / 2))}
</style>
</head>
<body>
<header class="gal-top">
  <b>Riso mixer</b>
  <div class="gal-intro">
    <h1>Dusk blue / dusty rose</h1>
    <p>One mockup. Nudge paper, cards, structural, accent and overprint if you want.
    Type colour, hurt labels and the grid recompute from those five.</p>
  </div>
</header>

<div class="mixer" id="mixer">
  <div class="mixer-inner">
    <button class="mixer-toggle" type="button" id="mixer-toggle" aria-expanded="true" aria-controls="mixer-body">
      <span class="mixer-toggle-action" id="mixer-action">Hide inks</span>
      <span class="mixer-now" id="mixer-now"></span>
      <span class="mixer-chevron" aria-hidden="true"></span>
    </button>
    <div class="mixer-body" id="mixer-body">
      <h2>Reset</h2>
      <div class="presets" id="presets"></div>
      <h2>Drums</h2>
      <div class="drums">
        <label class="drum"><span>Paper</span><span class="swatch" data-swatch="paper"><input type="color" data-key="paper"></span><input type="text" data-hex="paper" spellcheck="false" maxlength="7" aria-label="Paper hex"></label>
        <label class="drum"><span>Cards</span><span class="swatch" data-swatch="card"><input type="color" data-key="card"></span><input type="text" data-hex="card" spellcheck="false" maxlength="7" aria-label="Cards hex"></label>
        <label class="drum"><span>Structural</span><span class="swatch" data-swatch="structural"><input type="color" data-key="structural"></span><input type="text" data-hex="structural" spellcheck="false" maxlength="7" aria-label="Structural hex"></label>
        <label class="drum"><span>Accent</span><span class="swatch" data-swatch="accent"><input type="color" data-key="accent"></span><input type="text" data-hex="accent" spellcheck="false" maxlength="7" aria-label="Accent hex"></label>
        <label class="drum"><span>Overprint</span><span class="swatch" data-swatch="overprint"><input type="color" data-key="overprint"></span><input type="text" data-hex="overprint" spellcheck="false" maxlength="7" aria-label="Overprint hex"></label>
      </div>
      <p class="note" id="note"></p>
      <p class="hexline" id="hexline"></p>
    </div>
  </div>
</div>

<div class="studio"><div class="frames" id="frames"></div></div>

<!-- ============================================================
     PARTS
     Shared pieces. A frame names one with data-part, and the
     element is replaced by the part's contents, so parts add no
     wrappers. Parts can hold parts.
     ============================================================ -->
<template id="tpl-part-find">
  <div class="find">
    <label><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
      <input placeholder="Find a character" aria-label="Find a character"></label>
    <button class="sortbtn">Sort: level</button>
  </div>
</template>

<template id="tpl-part-plate">
  <div class="top">
    <h2 class="title">Characters</h2>
    <div data-part="find"></div>
  </div>
</template>

<template id="tpl-part-newwrap">
  <div class="newwrap"><button class="newbtn">Create character</button></div>
</template>

<template id="tpl-part-wide-plate">
  <div class="wide-plate">
    <div class="wide-plate-inner">
      <h2 class="title">Characters</h2>
    </div>
  </div>
</template>

<template id="tpl-part-toolbar">
  <div class="toolbar">
    <div class="toolbar-inner">
      <div data-part="find"></div>
      <button class="newbtn dnew">Create character</button>
    </div>
  </div>
</template>

<template id="tpl-part-draft-kethra">
  <article class="draft">
    <div class="tok">K</div>
    <div>
      <h3 class="name">Kethra Ironsong</h3>
      <p class="sub">Level 3 to 4, three of five choices made. Nothing changes on the sheet until you confirm.</p>
    </div>
    <button class="resume">Resume</button>
  </article>
</template>

<template id="tpl-part-draft-kethra-wide">
  <article class="draft">
    <div class="tok">K</div>
    <div>
      <h3 class="name">Kethra Ironsong, level 3 to 4</h3>
      <p class="sub">Three of five choices made. Next up is an ability increase or a feat. Nothing changes on the sheet until you confirm.</p>
    </div>
    <button class="resume">Resume level-up</button>
  </article>
</template>

<template id="tpl-part-tray">
  <div class="tray">
    <h3 class="trayhead">Waiting to be finished</h3>
    <div data-part="draft-kethra"></div>

<script>
(function(){
  var PRESETS = [
    {id:'p0s', name:'Dusk blue / dusty rose', note:'Darker, greyer blue on the plate, a rose that is not fluorescent, duskier paper so the inks have somewhere to sit. The reset button puts this pairing back if you have been turning the drums.',
      paper:'#eae6de', card:'#f0ece4', structural:'#2560b0', accent:'#e0689c', overprint:'#5c3d88'}
  ];

  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
  }
  function rgbToHex(r,g,b){
    return '#'+[r,g,b].map(function(x){
      return ('0'+Math.round(Math.max(0,Math.min(255,x))).toString(16)).slice(-2);
    }).join('');
  }
  function mix(a,b,t){
    var A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t);
  }
  function rgba(hex,a){
    var c = hexToRgb(hex);
    return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
  }
  function lum(hex){
    var rgb = hexToRgb(hex).map(function(c){
      c /= 255;
      return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
    });
    return 0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2];
  }
  var AA = 4.5;
  function contrast(x, y){
    var p = lum(x) + 0.05, q = lum(y) + 0.05;
    return p > q ? p / q : q / p;
  }
  function steps(from, to, by){
    var out = [], n = Math.round((to - from) / by);
    for(var i = 0; i <= n; i++) out.push(+(from + by * i).toFixed(2));
    return out;
  }
  // First candidate that reaches AA against every background, else the last candidate.
  function ensure(fn, ts, bgs){
    for(var i = 0; i < ts.length; i++){
      var c = fn(ts[i]);
      if(bgs.every(function(bg){ return contrast(c, bg) >= AA; })) return c;
    }
    return fn(ts[ts.length - 1]);
  }
  // Light text if it passes AA on the ink, otherwise the lightest darkened ink that does.
  function onInk(bg, paper){
    var light = lum(paper) > 0.65 ? mix(paper, '#ffffff', 0.4) : '#ffffff';
    if(contrast(light, bg) >= AA) return light;
    var dark = ensure(function(t){ return mix(bg, '#140c08', t); }, steps(0.6, 1, 0.02), [bg]);
    return contrast(dark, bg) >= contrast(light, bg) ? dark : light;
  }
  function parseHex(v){
    if(!v) return null;
    v = v.trim();
    if(v[0] !== '#') v = '#'+v;
    if(/^#([0-9a-fA-F]{3})$/.test(v) || /^#([0-9a-fA-F]{6})$/.test(v)){
      var rgb = hexToRgb(v);
      return rgbToHex(rgb[0], rgb[1], rgb[2]);
    }
    return null;
  }
  function derive(p){
    var paper = p.paper, card = p.card, structural = p.structural, accent = p.accent, overprint = p.overprint;
    var text = mix(structural, '#14110e', lum(structural) > 0.2 ? 0.72 : 0.35);
    if(lum(text) > 0.22) text = mix(text, '#14110e', 0.55);
    var onStructural = onInk(structural, paper);
    // A draft's tint is see-through and sits on paper, so text is checked
    // against the tint over paper as well as over the card colour.
    var draftSolid = mix(card, accent, 0.11), draftOnPaper = mix(paper, accent, 0.11);
    return {
      paper: paper, card: card, structural: structural, accent: accent, overprint: overprint, text: text,
      dim: ensure(function(t){ return mix(text, paper, t); }, steps(0.42, 0, -0.02), [paper, card, draftSolid, draftOnPaper]),
      onStructural: onStructural, onAccent: onInk(accent, paper), onOverprint: onInk(overprint, paper),
      accentText: ensure(function(t){ return mix(accent, '#1a0a08', t); }, steps(0.15, 0.9, 0.05), [card, draftSolid, draftOnPaper]),
      dot: rgba(structural, 0.10),
      line: rgba(accent, lum(accent) > 0.6 ? 0.16 : 0.10),
      track: rgba(lum(accent) > 0.55 ? mix(accent, '#3a3010', 0.35) : accent, 0.26),
      draftFill: rgba(accent, 0.11),
      rule: rgba(structural, 0.28)
    };
  }

  var FRAMES = [
    {section:'The list',
     text:'Six characters sorted by level, with Kethra&rsquo;s level-up waiting in the tray above them.'},
    {id:'list', label:'Characters and a level-up draft',
     note:'The draft tray sits above the list, with a dashed rule under it. Each card is one control: tapping anywhere on it opens the sheet. Create character sticks to the foot of the screen over a fade.'},
    {id:'d-list', desktop:true, label:'Rows with named Open sheet links',
     note:'The plate holds only the title. Search, sort and Create sit in a toolbar that sticks under it, and the plate, the toolbar and the list share one 1020 measure. Rows have columns of 74, 1fr, 84, 240 and 128.'},
    {id:'t-list-portrait', tablet:true, label:'Portrait, 820 by 1180',
     note:'The desktop plate and toolbar over one column of phone cards.'},
    {id:'t-list-landscape', tablet:true, label:'Landscape, 1180 by 820',
     note:'The same cards in two columns. The tray spans both.'},

    {section:'Loading and searching',
     text:'The first load gets a spinner, the only motion on the list. Search, sort and Create work from the first frame.'},
    {id:'loading', label:'First load',
     note:'The plate, search, sort and Create are in place before any data arrives. A spinner sits in the middle of the space the list will fill, with a quiet line in dim under it. The spinner is a structural arc turning on a rose-tint track, once every 0.9 seconds, drawn with react-native-svg rather than the platform&rsquo;s ActivityIndicator. It is a new exception to the design system&rsquo;s motion rules, and with reduced motion it holds still. The tray arrives with the list, because both come from one request.'},
    {id:'d-loading', desktop:true, label:'First load',
     note:'The same, a size up, centred under the toolbar.'},
    {id:'searching', label:'Searching',
     note:'The player has typed &ldquo;Ves&rdquo;. After the 250 ms debounce the request goes out and the previous results stay put. A 16 point version of the first-load spinner turns at the right of the field until the response lands, where the eye already is, so nothing below it shifts. It is a polite live region that reads &ldquo;Searching&hellip;&rdquo; to screen readers. On a fast connection it may never show, which is fine. Drafts ignore the search, so the tray stays.'},
    {id:'d-searching', desktop:true, label:'Searching',
     note:'The same spinner, at the same size, at the right of the wider field.'},

    {section:'Nothing to show',
     text:'An empty list is a dashed empty card, the system&rsquo;s mark for something not real yet. Search and sort only show when there are characters to find, so they drop out when the player has none.'},
    {id:'empty', label:'No characters yet',
     note:'No characters and no drafts. The plate holds only the title. The empty card names Create character, which is already on screen: at the foot on phone, in the toolbar on desktop.'},
    {id:'d-empty', desktop:true, label:'No characters yet',
     note:'The toolbar keeps Create character at its right-hand end and loses search and sort.'},
    {id:'draft-only', label:'No characters, one creation draft',
     note:'The tray alone. With no list under it, the dashed rule goes too. There is no empty card, because Resume is the next step and it is already there.'},
    {id:'d-draft-only', desktop:true, label:'No characters, one creation draft',
     note:'The same on desktop: title, Create, and the tray.'},
    {id:'no-results', label:'No search results',
     note:'Nothing matches &ldquo;Zephyr&rdquo;. The empty card quotes the search as typed and says search only looks at names, because a player who types &ldquo;dwarf&rdquo; would otherwise think something broke. The tray still shows, because drafts ignore the search.'},
    {id:'d-no-results', desktop:true, label:'No search results',
     note:'The empty card takes the list&rsquo;s place under the tray.'},

    {section:'Errors',
     text:'Errors borrow the warning strip at a larger size: the card colour, a solid rose edge, an outline icon and a bold lead. An error replaces the list, whether it happened on first load or during a search.'},
    {id:'signed-out', label:'Not signed in (temporary developer copy)',
     note:'The API returned 401. There is no login screen yet, so this copy is for developers and goes when sign-in arrives. It says so three ways: the Development only label, the dashed border that means not real yet, and copy that names an environment variable. Search, sort and Create are gone, because nothing on this screen works without a token. No Try again, because retrying cannot help until the token changes.'},
    {id:'d-signed-out', desktop:true, label:'Not signed in (temporary developer copy)',
     note:'With nothing to search or create, the toolbar goes too.'},
    {id:'failed', label:'Couldn&rsquo;t load',
     note:'A network error or a 500. The header stays, so a player can retry a search or create a character. Try again repeats the same request; while it runs, the first-load spinner takes the notice&rsquo;s place. It is the one button on the list that does something in this plan, because it stays on this screen.'},
    {id:'d-failed', desktop:true, label:'Couldn&rsquo;t load',
     note:'The notice runs the full measure; its text stops at 64 characters.'},

    {section:'Drafts and long content',
     text:'Creation drafts beside a level-up, and the longest name and subtitle a card is likely to meet.'},
    {id:'creation-drafts', label:'Creation drafts in the tray',
     note:'Most recently updated first: Nyra Ashfall, an unnamed draft, then Kethra&rsquo;s level-up. A draft with no name is called New character, and its token is an empty ring: the letter comes from a name it does not have yet, and an N would read as a real name. On phone a creation line leads with &ldquo;Creation&rdquo; where a level-up leads with its levels.'},
    {id:'d-creation-drafts', desktop:true, label:'Resume creation and Resume level-up',
     note:'The title adds &ldquo;new character&rdquo; or the levels, the line gives progress and the next step, and Resume names the kind. Next step phrases, from <code>next_step</code>: <code>choose_class</code> is &ldquo;choosing a class&rdquo; and <code>ability_score_or_feat</code> is &ldquo;an ability increase or a feat&rdquo;. A step with no phrase drops the Next up sentence.'},
    {id:'long', label:'Long name and multiclass subtitle',
     note:'Names and subtitles wrap and never truncate. The name is how a player tells characters apart, and a multiclass subtitle carries its levels and subclasses at the end, where an ellipsis would cut them. Both wrap in the column beside the level block. Subclasses follow in class order, separated by commas.'},
    {id:'d-long', desktop:true, label:'Long name on a desktop row',
     note:'The name column is the only flexible one, so the name and subtitle wrap there and the row grows. Level, meter and Open sheet stay centred on the row.'},
    {id:'t-long', tablet:true, label:'Long content in two columns, landscape',
     note:'Cards in a row share a height, so the long card&rsquo;s neighbour grows to match and its content centres, as it does in every card. In React Native that is a row of two cards with the default stretch.'},

    {section:'Incomplete characters',
     text:'Characters saved before every choice is made. Each card keeps its shape and says what is missing rather than inventing a value.'},
    {id:'incomplete', label:'Missing race, class or hit points',
     note:'From the top. No race: the subtitle starts at the class, with a capital. No hit points yet: no meter, and the line reads &ldquo;Hit points not set&rdquo;. Zero hit points: ten empty segments, and the zero in the hurt ink. No race or class: &ldquo;Race and class not set&rdquo;. Race only: the race alone. With no classes the level block shows a dim dash rather than 0, which is not a level, and those characters sort last.'},
    {id:'d-incomplete', desktop:true, label:'Missing race, class or hit points',
     note:'The level column keeps its dash and the vitals column its line, so the rows stay aligned.'}
  ];

  var wrap = document.getElementById('frames');
  var frameNo = 0, deskNo = 0, tabNo = 0;
  // Replaces each [data-part] element with its part, until none are left.
  function fillParts(root){
    var slot;
    while((slot = root.querySelector('[data-part]'))){
      slot.replaceWith(document.getElementById('tpl-part-' + slot.dataset.part).content.cloneNode(true));
    }
  }
  function frameText(col, label, note){
    var l = document.createElement('p');
    l.className = 'frame-label';
    l.innerHTML = label;
    var n = document.createElement('p');
    n.className = 'frame-note';
    n.innerHTML = note;
    col.appendChild(l);
    col.appendChild(n);
  }
  // Desktop and tablet frames sit on a stage, 1440 by 900 unless the template
  // sets data-size, scaled to the width the frame gets. Tablet frames share a
  // row, sized so both scale alike.
  function buildDesk(f, tpl, next){
    var size = (tpl.getAttribute('data-size') || '1440x900').split('x');
    var col = document.createElement('div');
    col.className = 'deskwrap';
    col.id = 'frame-' + f.id;
    col.dataset.kind = f.tablet ? 'tablet' : 'desk';
    if(f.tablet){ col.style.flex = size[0] + ' 1 0'; col.style.maxWidth = size[0] + 'px'; }
    frameText(col, (f.tablet ? 'Tablet ' + (++tabNo) : 'Desktop ' + (++deskNo)) + '. ' + f.label, f.note);
    var box = document.createElement('div');
    box.className = 'stagebox';
    var stage = document.createElement('div');
    stage.className = 'stage riso live';
    stage.dataset.w = size[0];
    stage.dataset.h = size[1];
    stage.style.width = size[0] + 'px';
    stage.style.height = size[1] + 'px';
    stage.appendChild(tpl.content.cloneNode(true));
    fillParts(stage);
    box.appendChild(stage);
    col.appendChild(box);
    wrap.appendChild(col);
    if(f.tablet && next && next.tablet) return;
    var br = document.createElement('div');
    br.className = 'frames-break';
    wrap.appendChild(br);
  }
  FRAMES.forEach(function(f, n){
    if(f.section){
      var h = document.createElement('div');
      h.className = 'frames-head';
      h.innerHTML = '<h2>' + f.section + '</h2><p>' + f.text + '</p>';
      wrap.appendChild(h);
      return;
    }
    var tpl = document.getElementById('tpl-' + f.id);
    if(!tpl) return;
    if(f.desktop || f.tablet){ buildDesk(f, tpl, FRAMES[n + 1]); return; }
    // A phone frame with a desktop partner starts a row, so the pair sits together.
    var next = FRAMES[n + 1];
    if(next && next.desktop){
      var br = document.createElement('div');
      br.className = 'frames-break';
      wrap.appendChild(br);
    }
    var col = document.createElement('div');
    col.className = 'framewrap';
    col.id = 'frame-' + f.id;
    frameText(col, (++frameNo) + '. ' + f.label, f.note);
    var phone = document.createElement('div');
    phone.className = 'phone';
    var screen = document.createElement('div');
    screen.className = 'phone-screen';
    var scroll = document.createElement('div');
    scroll.className = 'phone-scroll riso live';
    scroll.appendChild(tpl.content.cloneNode(true));
    fillParts(scroll);
    screen.appendChild(scroll);
    phone.appendChild(screen);
    col.appendChild(phone);
    wrap.appendChild(col);
  });

  var lives = document.querySelectorAll('.live');
  var picks = {paper:'', card:'', structural:'', accent:'', overprint:''};
  var activeId = PRESETS[0].id;
  var custom = false;

  function apply(t){
    lives.forEach(function(el){
      el.style.setProperty('--paper', t.paper);
      el.style.setProperty('--card', t.card);
      el.style.setProperty('--structural', t.structural);
      el.style.setProperty('--accent', t.accent);
      el.style.setProperty('--overprint', t.overprint);
      el.style.setProperty('--text', t.text);
      el.style.setProperty('--dim', t.dim);
      el.style.setProperty('--on-structural', t.onStructural);
      el.style.setProperty('--on-accent', t.onAccent);
      el.style.setProperty('--on-overprint', t.onOverprint);
      el.style.setProperty('--accent-text', t.accentText);
      el.style.setProperty('--dot', t.dot);
      el.style.setProperty('--line', t.line);
      el.style.setProperty('--track', t.track);
      el.style.setProperty('--draft-fill', t.draftFill);
      el.style.setProperty('--rule', t.rule);
    });
  }
  function syncPickers(){
    ['paper','card','structural','accent','overprint'].forEach(function(key){
      var hex = picks[key];
      var color = document.querySelector('input[data-key="'+key+'"]');
      var text = document.querySelector('input[data-hex="'+key+'"]');
      var sw = document.querySelector('[data-swatch="'+key+'"]');
      if(color) color.value = hex;
      if(text && document.activeElement !== text) text.value = hex;
      if(sw) sw.style.setProperty('--sw', hex);
    });
  }
  function setNote(){
    var preset = PRESETS.filter(function(p){ return p.id === activeId; })[0];
    var title = custom ? (preset.name + ', then tuned') : preset.name;
    document.getElementById('note').innerHTML = '<b>'+title+'.</b> '+preset.note;
    document.getElementById('hexline').textContent =
      'paper '+picks.paper+'   cards '+picks.card+'   structural '+picks.structural+'   accent '+picks.accent+'   overprint '+picks.overprint;
    document.getElementById('mixer-now').innerHTML =
      '<span class="mixer-now-inks">'+
      '<i style="background:'+picks.structural+'"></i>'+
      '<i style="background:'+picks.accent+'"></i>'+
      '<i style="background:'+picks.overprint+'"></i>'+
      '<i style="background:'+picks.paper+'"></i></span><b>'+title+'</b>';
  }
  function paint(){
    apply(derive(picks));
    syncPickers();
    setNote();
    document.querySelectorAll('.preset').forEach(function(btn){
      btn.setAttribute('aria-current', btn.dataset.id === activeId && !custom ? 'true' : 'false');
    });
  }
  function loadPreset(id){
    var p = PRESETS.filter(function(x){ return x.id === id; })[0];
    picks = {paper:p.paper, card:p.card, structural:p.structural, accent:p.accent, overprint:p.overprint};
    activeId = id;
    custom = false;
    paint();
  }

  var presetWrap = document.getElementById('presets');
  PRESETS.forEach(function(p){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'preset';
    btn.dataset.id = p.id;
    btn.innerHTML = '<span class="preset-inks">'+
      '<i style="background:'+p.structural+'"></i>'+
      '<i style="background:'+p.accent+'"></i>'+
      '<i style="background:'+p.overprint+'"></i>'+
      '<i style="background:'+p.paper+'"></i></span>'+p.name;
    btn.addEventListener('click', function(){ loadPreset(p.id); });
    presetWrap.appendChild(btn);
  });

  document.querySelectorAll('input[data-key]').forEach(function(input){
    input.addEventListener('input', function(){
      picks[input.dataset.key] = input.value;
      custom = true;
      paint();
    });
  });
  document.querySelectorAll('input[data-hex]').forEach(function(input){
    input.addEventListener('change', function(){
      var hex = parseHex(input.value);
      if(!hex){ input.value = picks[input.dataset.hex]; return; }
      picks[input.dataset.hex] = hex;
      custom = true;
      paint();
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ input.blur(); }
    });
  });

  function fit(){
    document.querySelectorAll('.stage').forEach(function(stage){
      var box = stage.parentElement, scale = Math.min(1, box.clientWidth / +stage.dataset.w);
      stage.style.transform = 'scale(' + scale + ')';
      box.style.height = (+stage.dataset.h * scale) + 'px';
    });
  }
  var mixer = document.getElementById('mixer');
  var mixerToggle = document.getElementById('mixer-toggle');
  var mixerAction = document.getElementById('mixer-action');
  function setMixerOpen(open){
    mixer.classList.toggle('is-closed', !open);
    mixerToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    mixerAction.textContent = open ? 'Hide inks' : 'Show inks';
  }
  mixerToggle.addEventListener('click', function(){
    setMixerOpen(mixer.classList.contains('is-closed'));
  });
  setMixerOpen(!window.matchMedia('(max-width: 720px)').matches);

  loadPreset(PRESETS[0].id);
  fit();
  window.addEventListener('resize', fit);
  document.fonts && document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
